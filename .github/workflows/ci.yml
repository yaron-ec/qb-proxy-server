name: CI

# Safety gate for qb-proxy-server (backend) + crm-frontend (frontend).
#
# This workflow intentionally does NOT touch any live production system:
# - No DATABASE_URL is set — backend tests run against the current
#   repository's test suite, which is designed to be DB-independent (mock
#   pools/clients). Any test that genuinely requires a live database
#   self-skips when DATABASE_URL is absent (see e.g.
#   test/integrationCredentialStore.test.js, test/qbTokenStore.test.js).
# - No QuickBooks/Gmail/SignNow/Handoff/Google credentials are configured —
#   nothing here calls a real external integration.
# - The frontend build only compiles static assets; it does not deploy.
#
# This does not replace Railway's own deploy pipeline — it is a pre-merge
# gate so that a build-breaking or test-breaking change is caught before it
# ever reaches `main` (and therefore before Railway attempts to build/deploy
# it).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntax + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax-check every backend JS file
        run: npm run test:syntax

      - name: Run backend test suite
        run: npm test

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    outputs:
      build_hash: ${{ steps.build-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom@30 (devDependency, used only by vitest here) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 — its bundled undici
          # requires >=22.19.0 — Node 20 is unsupported and fails with
          # "webidl.util.markAsUncloneable is not a function". This does
          # not affect Railway's production image, which pins node:20-alpine
          # independently in crm-frontend/Dockerfile and never installs
          # jsdom in production (npm install --omit=dev).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crm-frontend/package-lock.json

      - name: Install frontend dependencies (full, for component tests)
        working-directory: crm-frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend component tests
        working-directory: crm-frontend
        # vitest/jsdom/testing-library are devDependencies only — the
        # production Dockerfile installs with --omit=dev and never runs
        # them, so CI is the only place these regression tests execute.
        run: npx vitest run

      - name: Reproduce production dependency install (matches crm-frontend/Dockerfile)
        working-directory: crm-frontend
        # Same install command as the Dockerfile's build stage, against the
        # same committed lockfile — catches a Railway-build-breaking
        # dependency/lockfile problem here instead of only discovering it
        # from a failed Railway deployment (this exact gap let three
        # dependency-related Railway build failures reach main undetected
        # by a CI that only ever ran a full `npm install`).
        run: |
          rm -rf node_modules
          npm ci --omit=dev --no-audit --no-fund

      - name: Build frontend (production, --mode exit)
        working-directory: crm-frontend
        # Runs against the production-only install above — same command
        # and same installed tree as crm-frontend/Dockerfile's build stage.
        run: npm run build:exit

      - name: Extract this build's sw.js hash
        id: build-hash
        working-directory: crm-frontend
        # The exact hash swBuildHashPlugin baked into THIS build's sw.js —
        # used by verify-production below to prove the live site is serving
        # these exact bits, not just a matching commit SHA (the frontend has
        # no git-SHA marker of its own; this is the strongest available
        # verification: the actual built artifact, not just its source).
        run: |
          hash=$(grep -oE "ec-crm-v[A-Za-z0-9_-]+" dist/sw.js | head -1 | sed 's/ec-crm-v//')
          if [ -z "$hash" ]; then echo "::error::Could not extract build hash from dist/sw.js"; exit 1; fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  # Production-correctness audit finding (P0): CI passing has never meant the
  # change actually reached production — PR #59 merged and tested clean while
  # its frontend changes silently never deployed (the frontend service has no
  # committed deploy trigger; see railway.json's own header and CLAUDE.md).
  # This job closes that specific gap for every future push to main: it does
  # NOT gate the merge (it only ever runs after a push already landed, and
  # Railway's own deploy time is outside this repo's control either way) —
  # it gives a genuine, unambiguous PASS/FAIL/SKIPPED signal instead.
  #
  # Four states, never conflated:
  #   SKIPPED (gray, whole job) — PRODUCTION_BACKEND_URL / PRODUCTION_FRONTEND_URL
  #     repo variables aren't set yet. This is the state until an operator
  #     configures them — never reported as green, never as red.
  #   SKIPPED (gray, one check) — a service's own Railway Watch Paths (mirrored
  #     in scripts/ci/computeDeployRelevance.js) weren't touched by this push,
  #     so Railway never redeployed it and polling for a new version would be
  #     meaningless. Confirmed necessary directly: PR #60 (CLAUDE.md-only) was
  #     observed via the Railway API to skip deployment on BOTH services —
  #     without this check, that exact push would have polled for 10 minutes
  #     and reported FAILED on a perfectly healthy release.
  #   FAILED (red)   — a service's watched paths WERE touched, but the live
  #     site did not confirm this exact commit/build within the timeout. A
  #     genuine production problem.
  #   PASSED (green) — the live backend's build_commit matches this push's
  #     SHA AND/OR the live frontend's sw.js hash matches this exact build
  #     (independently — either can PASS while the other is SKIPPED).
  # A FAILED result here is never downgraded to a soft ::warning:: annotation
  # — it is a real job failure, visible in the Actions tab and in any branch
  # protection history, exactly so it can never be mistaken for a pass.
  #
  # No privileged CI credential: the backend check reads build_commit off the
  # pre-existing, UNAUTHENTICATED GET /health (lib/buildInfo.js) — not the
  # admin-JWT-gated GET /api/v1/system/info. An earlier version of this job
  # sent X-Proxy-Secret to that admin route, which never accepts it
  # (routes/systemInfo.js uses requireAuth, Bearer-JWT only — see
  # lib/rbac.js) — the job could never have passed. No secret is needed or
  # read by this job at all.
  #
  # Reruns: GitHub preserves the original push event's before/after SHAs
  # across a workflow rerun, so the relevance computation below is identical
  # and stable on a rerun — nothing here is time- or run-dependent.
  verify-production:
    name: Verify production (backend + frontend)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_BACKEND_URL != '' && vars.PRODUCTION_FRONTEND_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed to diff against github.event.before

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine which services this push could have redeployed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # github.event.before is the all-zero SHA on the very first push to
          # a ref — there is no prior commit to diff against, so we cannot
          # prove anything was IRRELEVANT. Fail safe: run both checks rather
          # than silently skip. Same fail-safe if the SHA can't be resolved
          # even with full history (should not happen, but a diff we can't
          # compute must never be read as "nothing changed").
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Cannot diff against a prior commit (initial push, merge commit base not resolvable, or before-SHA missing) — defaulting both checks to relevant."
            echo "backend_relevant=true" >> "$GITHUB_OUTPUT"
            echo "frontend_relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two-dot diff: every file that differs between the previous main
          # tip and this one. Correct for both a single commit and a merge
          # commit (an entire merged PR's file set) — either way it's just
          # "every path that differs between these two trees," which is
          # exactly what Railway's own Watch Paths evaluate against.
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files (${#CHANGED[@]}):"
          printf '%s\n' "${CHANGED[@]}"

          backend=$(node scripts/ci/computeDeployRelevance.js qb-proxy-server "${CHANGED[@]}")
          frontend=$(node scripts/ci/computeDeployRelevance.js insightful-encouragement "${CHANGED[@]}")
          echo "backend_relevant=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend_relevant=$frontend" >> "$GITHUB_OUTPUT"

      - name: Poll backend build_commit
        id: backend-check
        if: steps.changed.outputs.backend_relevant == 'true'
        env:
          URL: ${{ vars.PRODUCTION_BACKEND_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          for i in $(seq 1 20); do
            sha=$(curl -sf "$URL/health" | jq -r '.build_commit // empty') || sha=""
            if [ "$sha" = "$EXPECTED" ]; then
              echo "Backend confirmed at $sha (attempt $i)"
              echo "result=pass" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: backend reports '$sha', expected '$EXPECTED' — retrying in 30s"
            sleep 30
          done
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "::error::Backend never reported build_commit=$EXPECTED within 10 minutes of this push"
          exit 1

      - name: Poll frontend sw.js build hash
        id: frontend-check
        if: always() && steps.backend-check.outcome != 'cancelled' && steps.changed.outputs.frontend_relevant == 'true'
        env:
          URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
          EXPECTED: ${{ needs.frontend.outputs.build_hash }}
        run: |
          for i in $(seq 1 20); do
            hash=$(curl -sf "$URL/sw.js" | grep -oE "ec-crm-v[A-Za-z0-9_-]+" | head -1 | sed 's/ec-crm-v//') || hash=""
            if [ "$hash" = "$EXPECTED" ]; then
              echo "Frontend confirmed at $hash (attempt $i)"
              echo "result=pass" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: frontend reports '$hash', expected '$EXPECTED' — retrying in 30s"
            sleep 30
          done
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "::error::Frontend never served build hash $EXPECTED within 10 minutes of this push"
          exit 1

      - name: Summary
        if: always()
        run: |
          backend_msg="${{ steps.backend-check.outputs.result || 'did not run' }}"
          if [ "${{ steps.changed.outputs.backend_relevant }}" = "false" ]; then
            backend_msg="skipped — no backend-relevant files changed this push"
          fi
          frontend_msg="${{ steps.frontend-check.outputs.result || 'did not run' }}"
          if [ "${{ steps.changed.outputs.frontend_relevant }}" = "false" ]; then
            frontend_msg="skipped — no frontend-relevant files changed this push"
          fi
          {
            echo "## Production verification — $GITHUB_SHA"
            echo "- Backend: $backend_msg"
            echo "- Frontend: $frontend_msg"
          } >> "$GITHUB_STEP_SUMMARY"
