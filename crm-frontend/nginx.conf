server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets — immutable cache (safe: filename changes with content)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry HTML — always revalidate so new deploys are visible
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Never cache the service worker — browser must always see the latest SW
    # so the update lifecycle (install → activate → clear caches) fires on
    # every new deployment. Without this, a stale SW could prevent users from
    # receiving new frontend builds.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/javascript;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}